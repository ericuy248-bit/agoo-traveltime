name: Agoo corridor travel-time logger

# Runs the collector on GitHub's free servers every 15 minutes, no laptop
# needs to stay on. Commits the day's CSV back into the repo each run.
#
# Setup:
#   1. Push this repo (including collect_traveltimes.js) to GitHub.
#   2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#        Name:  GOOGLE_MAPS_API_KEY
#        Value: <your API key>
#   3. Adjust the cron lines below to your active hours (times are UTC;
#      Philippines is UTC+8, so 06:00-18:00 PH = 22:00-10:00 UTC, wrapping
#      midnight — see the two cron lines already set for that below).
#   4. Commit this file as .github/workflows/traveltime.yml
#
# Note: GitHub disables scheduled workflows after 60 days with no repo
# activity — push a small commit occasionally during the data-collection week.

on:
  schedule:
    # 22:00-23:45 UTC = 06:00-07:45 PH
    - cron: "*/15 22-23 * * *"
    # 00:00-09:45 UTC = 08:00-17:45 PH
    - cron: "*/15 0-9 * * *"
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run one collection round
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node collect_traveltimes.js --once

      - name: Commit updated CSVs
        run: |
          git config user.name "traveltime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add traveltime_logs/*.csv
          git diff --staged --quiet || git commit -m "Log travel times $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
