name: Agoo corridor travel-time logger

on:
  schedule:
    - cron: "30,45 22 * * *"      # 06:30, 06:45 PH
    - cron: "0,15,30,45 23 * * *" # 07:00, 07:15, 07:30, 07:45 PH
  workflow_dispatch: {}   # lets you trigger a manual test run from the Actions tab

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run one collection round
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node collect_traveltimes.js --once

      - name: Commit updated CSVs (permanent — sync anytime with git pull)
        run: |
          git config user.name "traveltime-bot"
          git config user.email "actions@users.noreply.github.com"
          git add traveltime_logs/*.csv
          git diff --staged --quiet || git commit -m "Log travel times $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Upload this run's CSVs as a downloadable artifact
   
        uses: actions/upload-artifact@v4
        with:
          name: traveltime-logs-${{ github.run_id }}
          path: traveltime_logs/*.csv
          retention-days: 7
          path: traveltime_logs/*.csv
          retention-days: 7
